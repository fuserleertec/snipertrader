[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sniper-quant"
version = "1.2.0"
description = "SniperTrader Phase 2 quant: risk pre-filter, setup_signals gate, Setups 1–3 walk-forward, lifecycle."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "SniperTrader.ai" }]
license = { text = "Proprietary" }
dependencies = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.27",
  "pydantic>=2.6",
  "pydantic-settings>=2.2",
  "asyncpg>=0.29",
  "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-asyncio>=0.23",
]
kafka = [
  "aiokafka>=0.10",
]

[project.scripts]
sniper-quant = "sniper_quant.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]
filterwarnings = ["ignore::DeprecationWarning"]
