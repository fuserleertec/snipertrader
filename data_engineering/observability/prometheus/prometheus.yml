# Scrape the three Phase 2/3 processes. Wire this file into a Prometheus
# container or Grafana Cloud agent. Ports match docker-compose.yml.
global:
  scrape_interval: 10s
  evaluation_interval: 10s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: sniper-api
    static_configs:
      - targets: ["api:8000"]
        labels: { service: api }
    metrics_path: /metrics
  - job_name: sniper-pipeline
    static_configs:
      - targets: ["pipeline:9101"]
        labels: { service: pipeline }
  - job_name: sniper-killzone
    static_configs:
      - targets: ["killzone:9102"]
        labels: { service: killzone }
