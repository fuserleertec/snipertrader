[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sniper-data"
version = "3.0.0"
description = "SniperTrader data-engineering: Phase 1 ticks/VWAP + Phase 2 AVWAP + Phase 3 performance snapshot, options/order-flow, scale."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "SniperTrader.ai" }]
license = { text = "Proprietary" }
dependencies = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.27",
  "pydantic>=2.6",
  "pydantic-settings>=2.2",
  "redis>=5.0",
  "asyncpg>=0.29",
  "aiokafka>=0.10",
  "httpx>=0.27",
  "websockets>=12.0",
  "orjson>=3.9",
  "prometheus-client>=0.20",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-asyncio>=0.23",
]

[project.scripts]
sniper-data = "sniper_data.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]
filterwarnings = ["ignore::DeprecationWarning"]
